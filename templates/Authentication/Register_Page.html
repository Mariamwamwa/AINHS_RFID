{% extends 'AUTHENTICATION/Base.html' %}
{% load static %}

{% block title %}
Create Account | AINHS Attendance System
{% endblock %}


{% block extra_css %}

<link
    rel="stylesheet"
    href="{% static 'css/Authentication_UI/Register_Page.css' %}"
>

{% endblock %}


{% block content %}

<!-- =========================================================
     REGISTER SECTION
     ========================================================= -->

<section class="register-section">

    <!-- Background Decorations -->

    <div class="decoration decoration-one"></div>

    <div class="decoration decoration-two"></div>


    <!-- Registration Card -->

    <div class="register-card">


        <!-- =================================================
             REGISTER HEADER
             ================================================= -->

        <div class="register-header">

            <h1>
                Create Account
            </h1>

            <p>
                Register an account.
            </p>

        </div>


        <!-- =================================================
             REGISTRATION FORM
             ================================================= -->

        <form
            action="#"
            method="POST"
        >

            {% csrf_token %}


            <!-- =============================================
                 TWO COLUMN FORM
                 ============================================= -->

            <div class="form-columns">


                <!-- =========================================
                     LEFT COLUMN
                     ========================================= -->

                <div class="form-column">


                    <!-- ID NUMBER -->

                    <div class="form-group">

                        <label for="id-number">
                            ID No.
                        </label>

                        <input
                            type="text"
                            id="id-number"
                            name="id_number"
                            placeholder="Enter ID number"
                            required
                        >

                    </div>


                    <!-- ROLE + DEPARTMENT -->

                    <div class="form-row">


                        <!-- ROLE -->

                        <div class="form-group">

                            <label for="role">
                                Role
                            </label>

                            <select
                                id="role"
                                name="role"
                                required
                            >

                                <option
                                    value=""
                                    disabled
                                    selected
                                >
                                    Select role
                                </option>

                                <option value="ADMIN">
                                    ADMIN
                                </option>

                                <option value="TEACHER">
                                    TEACHER
                                </option>

                            </select>

                        </div>


                        <!-- DEPARTMENT -->

                        <div class="form-group">

                            <label for="department">
                                Department
                            </label>

                            <select
                                id="department"
                                name="department"
                                required
                            >

                                <option
                                    value=""
                                    disabled
                                    selected
                                >
                                    Select department
                                </option>

                                <option value="JHS">
                                    JHS
                                </option>

                                <option value="SHS">
                                    SHS
                                </option>

                            </select>

                        </div>

                    </div>


                    <!-- LAST NAME -->

                    <div class="form-group">

                        <label for="last-name">
                            Last Name
                        </label>

                        <input
                            type="text"
                            id="last-name"
                            name="last_name"
                            placeholder="Enter last name"
                            required
                        >

                    </div>


                    <!-- FIRST NAME -->

                    <div class="form-group">

                        <label for="first-name">
                            First Name
                        </label>

                        <input
                            type="text"
                            id="first-name"
                            name="first_name"
                            placeholder="Enter first name"
                            required
                        >

                    </div>


                    <!-- MIDDLE NAME -->

                    <div class="form-group">

                        <label for="middle-name">
                            Middle Name
                        </label>

                        <input
                            type="text"
                            id="middle-name"
                            name="middle_name"
                            placeholder="Enter middle name"
                        >

                    </div>

                </div>


                <!-- =========================================
                     RIGHT COLUMN
                     ========================================= -->

                <div class="form-column">


                    <!-- USERNAME -->

                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Create a username"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-input">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Create a password"
                                required
                            >

                            <button
                                type="button"
                                class="show-password"
                                onclick="togglePassword('password', this)"
                                aria-label="Show password"
                            >

                                <span class="material-icons">
                                    lock
                                </span>

                            </button>

                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group">

                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <div class="password-input">

                            <input
                                type="password"
                                id="confirm-password"
                                name="confirm_password"
                                placeholder="Confirm your password"
                                required
                            >

                            <button
                                type="button"
                                class="show-password"
                                onclick="togglePassword('confirm-password', this)"
                                aria-label="Show password"
                            >

                                <span class="material-icons">
                                    lock
                                </span>

                            </button>

                        </div>

                    </div>


                    <!-- SECURITY QUESTION -->

                    <div class="form-group">

                        <label for="security-question">
                            Security Question
                        </label>

                        <select
                            id="security-question"
                            name="security_question"
                            required
                        >

                            <option
                                value=""
                                disabled
                                selected
                            >
                                Select security question
                            </option>

                            <option value="birthplace">
                                What is your place of birth?
                            </option>

                            <option value="mother-maiden-name">
                                What is your mother's maiden name?
                            </option>

                            <option value="childhood-nickname">
                                What was your childhood nickname?
                            </option>

                            <option value="favorite-teacher">
                                Who was your favorite teacher?
                            </option>

                            <option value="favorite-place">
                                What is your favorite place?
                            </option>

                        </select>

                    </div>


                    <!-- SECURITY ANSWER -->

                    <div class="form-group">

                        <label for="security-answer">
                            Security Answer
                        </label>

                        <input
                            type="text"
                            id="security-answer"
                            name="security_answer"
                            placeholder="Enter your answer"
                            required
                        >

                    </div>

                </div>

            </div>


            <!-- =================================================
                 CREATE ACCOUNT BUTTON
                 ================================================= -->

            <button
                type="submit"
                class="create-account-btn"
            >
                Create Account
            </button>


            <!-- =================================================
                 BACK TO LOGIN
                 ================================================= -->

            <div class="back-login">

                <span>
                    Already have an account?
                </span>

                <a href="{% url 'login' %}">
                    Login here
                </a>

            </div>

        </form>

    </div>

</section>


<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script>

function togglePassword(inputId, button) {

    const password =
        document.getElementById(inputId);

    const icon =
        button.querySelector(".material-icons");


    if (password.type === "password") {

        password.type = "text";

        icon.textContent = "lock_open";

        button.setAttribute(
            "aria-label",
            "Hide password"
        );

    } else {

        password.type = "password";

        icon.textContent = "lock";

        button.setAttribute(
            "aria-label",
            "Show password"
        );

    }

}

</script>

{% endblock %}
