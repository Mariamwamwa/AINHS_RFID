{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        AINHS Admin | Attendance System
        {% endblock %}
    </title>


    <!-- =====================================================
         MATERIAL ICONS
         ===================================================== -->

    <link
        href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
         ===================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- =====================================================
         ADMIN BASE CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="{% static 'css/Admin_UI/Admin_Base.css' %}"
    >


    <!-- =====================================================
         PAGE-SPECIFIC CSS
         ===================================================== -->

    {% block extra_css %}
    {% endblock %}

</head>


<body>


    <!-- =====================================================
         ADMIN HEADER + SIDEBAR
         ===================================================== -->

    {% include 'ADMIN/Admin_Header_Sidebar.html' %}



    <!-- =====================================================
         ADMIN PAGE CONTENT
         ===================================================== -->

    <main class="main-content">

        {% block content %}
        {% endblock %}

    </main>



    <!-- =====================================================
         PAGE-SPECIFIC JAVASCRIPT
         ===================================================== -->

    {% block extra_js %}
    {% endblock %}


</body>

</html>
